<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Android Development - 499 Câu Hỏi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-number {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .question-text {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .result-message.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .result-message.incorrect {
            background: #ffebee;
            color: #c62828;
        }

        .answer-explanation {
            margin-top: 20px;
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
            color: #666;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: #f0f0f0;
            color: #333;
        }

        .btn-next:hover {
            background: #e0e0e0;
        }

        .btn-prev {
            background: #f0f0f0;
            color: #333;
        }

        .btn-prev:hover {
            background: #e0e0e0;
        }

        .hidden {
            display: none;
        }

        .results-screen {
            text-align: center;
        }

        .results-screen h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .score-percentage {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 20px;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-download {
            background: #4caf50;
            color: white;
            margin-top: 10px;
        }

        .btn-download:hover {
            background: #45a049;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 22px;
            }

            .question-text {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Quiz Screen -->
        <div id="quiz-screen">
            <div class="header">
                <h1>📱 Quiz Android Development</h1>
                <p style="color: #666; margin-top: 5px;">500 câu hỏi trắc nghiệm</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">Câu 1 / 499</div>
            </div>

            <div class="question-section">
                <div class="question-number" id="question-num">Câu 1</div>
                <div class="question-text" id="question-text">Loading...</div>

                <div class="options" id="options-container">
                    <!-- Options will be inserted here -->
                </div>

                <div id="result-message" class="result-message hidden"></div>
                <div id="answer-explanation" class="answer-explanation hidden"></div>
            </div>

            <div class="buttons">
                <button class="btn-prev" id="btn-prev" onclick="previousQuestion()">← Câu trước</button>
                <button class="btn-submit" id="btn-submit" onclick="submitAnswer()">Trả lời</button>
                <button class="btn-next" id="btn-next" onclick="nextQuestion()" style="display: none;">Câu tiếp →</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="results-screen hidden">
            <h2>🎉 Bạn đã hoàn thành Quiz!</h2>
            <div class="score-display" id="final-score">0/499</div>
            <div class="score-percentage" id="final-percentage">0%</div>
            
            <div class="stats">
                <div class="stat-item">
                    <span>✓ Đúng:</span>
                    <strong id="correct-count">0</strong>
                </div>
                <div class="stat-item">
                    <span>✗ Sai:</span>
                    <strong id="wrong-count">0</strong>
                </div>
                <div class="stat-item">
                    <span>⏭️ Chưa trả lời:</span>
                    <strong id="unanswered-count">0</strong>
                </div>
            </div>

            <button class="btn-restart" onclick="restartQuiz()">🔄 Làm lại Quiz</button>
            <button class="btn-download" onclick="downloadResults()">⬇️ Tải kết quả</button>
        </div>
    </div>

    <script>
        const questions = [{"question": "Câu 1. Android là gì?", "options": {"A": "Một phần mềm thiết kế đồ họa", "B": "Một hệ điều hành di động mã nguồn mở", "C": "Một trình duyệt web", "D": "Một cơ sở dữ liệu"}, "answer": "B"}, {"question": "Câu 2. Android được phát triển chủ yếu bởi công ty nào?", "options": {"A": "Apple", "B": "Microsoft", "C": "Google", "D": "Intel"}, "answer": "C"}, {"question": "Câu 3. Android được xây dựng dựa trên nhân hệ điều hành nào?", "options": {"A": "Windows", "B": "Linux", "C": "DOS", "D": "Unix"}, "answer": "B"}, {"question": "Câu 4. Android Studio là gì?", "options": {"A": "Hệ điều hành Android", "B": "IDE phát triển ứng dụng Android", "C": "Trình duyệt web", "D": "Máy ảo Android"}, "answer": "B"}, {"question": "Câu 5. SDK là viết tắt của?", "options": {"A": "Software Development Kit", "B": "System Data Kit", "C": "Software Design Key", "D": "Security Development Kit"}, "answer": "A"}, {"question": "Câu 6. OHA là viết tắt của?", "options": {"A": "Open Hardware Android", "B": "Open Handset Alliance", "C": "Online Host Android", "D": "Open Host Application"}, "answer": "B"}, {"question": "Câu 7. Google Play là gì?", "options": {"A": "Trình biên dịch Java", "B": "Kho ứng dụng Android", "C": "Hệ điều hành Android", "D": "Công cụ thiết kế giao diện"}, "answer": "B"}, {"question": "Câu 8. Tập tin giao diện Android thường được lưu ở định dạng?", "options": {"A": "TXT", "B": "HTML", "C": "XML", "D": "DOCX"}, "answer": "C"}, {"question": "Câu 9. Thư mục chứa giao diện XML là?", "options": {"A": "drawable", "B": "values", "C": "layout", "D": "mipmap"}, "answer": "C"}, {"question": "Câu 10. Thành phần nào đại diện cho một màn hình trong Android?", "options": {"A": "Service", "B": "Activity", "C": "Intent", "D": "Adapter"}, "answer": "B"}, {"question": "Câu 11. Hàm nào được gọi đầu tiên khi Activity khởi tạo?", "options": {"A": "onResume()", "B": "onPause()", "C": "onCreate()", "D": "onStop()"}, "answer": "C"}, {"question": "Câu 12. Phương thức dùng để hiển thị giao diện cho Activity?", "options": {"A": "setLayout()", "B": "setContentView()", "C": "showLayout()", "D": "displayView()"}, "answer": "B"}, {"question": "Câu 13. Activity chuyển sang trạng thái tương tác trực tiếp với người dùng tại?", "options": {"A": "onCreate()", "B": "onStart()", "C": "onResume()", "D": "onDestroy()"}, "answer": "C"}, {"question": "Câu 14. Khi Activity không còn hiển thị sẽ gọi?", "options": {"A": "onStop()", "B": "onResume()", "C": "onCreate()", "D": "onRestart()"}, "answer": "A"}, {"question": "Câu 15. Khi Activity bị hủy hoàn toàn sẽ gọi?", "options": {"A": "onPause()", "B": "onDestroy()", "C": "onResume()", "D": "onStart()"}, "answer": "B"}, {"question": "Câu 16. Thành phần dùng để hiển thị văn bản?", "options": {"A": "EditText", "B": "Button", "C": "TextView", "D": "ImageView"}, "answer": "C"}, {"question": "Câu 17. Thành phần dùng để nhập dữ liệu?", "options": {"A": "TextView", "B": "EditText", "C": "ImageView", "D": "ListView"}, "answer": "B"}, {"question": "Câu 18. Thành phần dùng để hiển thị hình ảnh?", "options": {"A": "TextView", "B": "Button", "C": "ImageView", "D": "Spinner"}, "answer": "C"}, {"question": "Câu 19. Thành phần dùng để thực hiện thao tác khi nhấn?", "options": {"A": "Button", "B": "ImageView", "C": "TextView", "D": "Adapter"}, "answer": "A"}, {"question": "Câu 20. Đơn vị được khuyến nghị cho kích thước chữ?", "options": {"A": "px", "B": "cm", "C": "sp", "D": "mm"}, "answer": "C"}, {"question": "Câu 21. Thuộc tính nào KHÔNG thuộc 8 đặc điểm của người dùng thiết bị di động?", "options": {"A": "Luôn kết nối Internet", "B": "Di động và linh hoạt", "C": "Chỉ sử dụng máy tính để bàn", "D": "Đa nhiệm"}, "answer": "C"}, {"question": "Câu 22. Người dùng thiết bị di động thường quan tâm đến vấn đề gì?", "options": {"A": "Bảo mật và quyền riêng tư", "B": "Tăng kích thước màn hình CRT", "C": "Giảm bộ nhớ RAM máy chủ", "D": "Ép xung CPU"}, "answer": "A"}, {"question": "Câu 23. Kiến trúc N-Tier thường gồm bao nhiêu tầng chính?", "options": {"A": "1", "B": "2", "C": "3", "D": "10"}, "answer": "C"}, {"question": "Câu 24. Trong kiến trúc Client-Server, điện thoại Android thường đóng vai trò?", "options": {"A": "Server", "B": "Client", "C": "Database", "D": "Compiler"}, "answer": "B"}, {"question": "Câu 25. Android thuộc loại hệ điều hành?", "options": {"A": "Đóng hoàn toàn", "B": "Mã nguồn mở", "C": "Không có SDK", "D": "Không hỗ trợ ứng dụng"}, "answer": "B"}, {"question": "Câu 26. Ngôn ngữ lập trình phổ biến nhất cho Android hiện nay là?", "options": {"A": "Pascal", "B": "COBOL", "C": "Kotlin", "D": "PHP"}, "answer": "C"}, {"question": "Câu 27. Java vẫn được hỗ trợ trong Android vì?", "options": {"A": "Không có ngôn ngữ khác", "B": "Tương thích với nhiều dự án cũ", "C": "Bắt buộc bởi Google", "D": "Chạy nhanh hơn mọi ngôn ngữ"}, "answer": "B"}, {"question": "Câu 28. Android Runtime trước đây được gọi là?", "options": {"A": "JVM", "B": "CLR", "C": "Dalvik", "D": "Docker"}, "answer": "C"}, {"question": "Câu 29. Thành phần nào dùng để chạy tác vụ nền?", "options": {"A": "Activity", "B": "Service", "C": "Intent", "D": "Fragment"}, "answer": "B"}, {"question": "Câu 30. Broadcast Receiver dùng để?", "options": {"A": "Nhận và xử lý Broadcast", "B": "Tạo giao diện", "C": "Lưu dữ liệu", "D": "Vẽ hình"}, "answer": "A"}, {"question": "Câu 31. Content Provider dùng để?", "options": {"A": "Chia sẻ dữ liệu giữa ứng dụng", "B": "Tăng tốc CPU", "C": "Vẽ giao diện", "D": "Nén ảnh"}, "answer": "A"}, {"question": "Câu 32. Intent được dùng để?", "options": {"A": "Giao tiếp giữa các thành phần Android", "B": "Quản lý RAM", "C": "Tăng tốc Internet", "D": "Quản lý pin"}, "answer": "A"}, {"question": "Câu 33. Explicit Intent là?", "options": {"A": "Intent chỉ rõ thành phần đích", "B": "Intent không xác định đích", "C": "Intent của hệ điều hành", "D": "Intent của SQLite"}, "answer": "A"}, {"question": "Câu 34. Implicit Intent là?", "options": {"A": "Intent chỉ rõ Activity", "B": "Intent không chỉ         let currentQuestion = 0;
        let answers = {};
        let answered = {};

        function displayQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-num').textContent = `Câu ${currentQuestion + 1}`;
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('progress-text').textContent = `Câu ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-fill').style.width = (((currentQuestion + 1) / questions.length * 100) + '%');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            ['A', 'B', 'C', 'D'].forEach(letter => {
                const div = document.createElement('div');
                div.className = 'option';
                if (answers[currentQuestion] === letter) div.classList.add('selected');

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'answer';
                input.value = letter;
                input.id = 'option-' + letter;
                input.checked = answers[currentQuestion] === letter;

                const label = document.createElement('label');
                label.htmlFor = 'option-' + letter;
                label.innerHTML = `<strong>${letter}.</strong> ${q.options[letter]}`;

                div.appendChild(input);
                div.appendChild(label);
                div.onclick = () => {
                    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    input.checked = true;
                    answers[currentQuestion] = letter;
                };

                container.appendChild(div);
            });

            // Show result if already answered
            if (answered[currentQuestion]) {
                showResult();
            } else {
                document.getElementById('result-message').classList.add('hidden');
                document.getElementById('answer-explanation').classList.add('hidden');
            }

            // Update button states
            document.getElementById('btn-prev').disabled = currentQuestion === 0;
            document.getElementById('btn-submit').style.display = answered[currentQuestion] ? 'none' : 'block';
            document.getElementById('btn-next').style.display = answered[currentQuestion] ? 'block' : 'none';
        }

        function submitAnswer() {
            if (answers[currentQuestion] === undefined) {
                alert('Vui lòng chọn một đáp án');
                return;
            }

            answered[currentQuestion] = true;
            showResult();
            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
        }

        function showResult() {
            const q = questions[currentQuestion];
            const selected = answers[currentQuestion];
            const correct = q.answer === selected;

            const resultMsg = document.getElementById('result-message');
            resultMsg.classList.remove('hidden', 'correct', 'incorrect');
            resultMsg.classList.add(correct ? 'correct' : 'incorrect');
            resultMsg.textContent = correct ? '✓ Đúng!' : '✗ Sai!';

            // Highlight options
            document.querySelectorAll('.option').forEach((option, index) => {
                option.classList.remove('correct', 'incorrect');
                const optionLetter = ['A', 'B', 'C', 'D'][index];
                if (optionLetter === q.answer) {
                    option.classList.add('correct');
                } else if (optionLetter === selected && !correct) {
                    option.classList.add('incorrect');
                }
            });

            // Show explanation
            const explanation = document.getElementById('answer-explanation');
            explanation.classList.remove('hidden');
            explanation.innerHTML = `<strong>Đáp án đúng:</strong> ${q.answer}. ${q.options[q.answer]}`;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                displayQuestion();
                window.scrollTo(0, 0);
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
                window.scrollTo(0, 0);
            }
        }

        function showResults() {
            let correct = 0;
            for (let i = 0; i < questions.length; i++) {
                if (answers[i] === questions[i].answer) {
                    correct++;
                }
            }

            const wrong = Object.keys(answered).length - correct;
            const unanswered = questions.length - Object.keys(answered).length;
            const percentage = Math.round((correct / questions.length) * 100);

            document.getElementById('final-score').textContent = `${correct}/${questions.length}`;
            document.getElementById('final-percentage').textContent = `${percentage}%`;
            document.getElementById('correct-count').textContent = correct;
            document.getElementById('wrong-count').textContent = wrong;
            document.getElementById('unanswered-count').textContent = unanswered;

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestion = 0;
            answers = {};
            answered = {};
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            displayQuestion();
        }

        function downloadResults() {
            let correct = 0;
            for (let i = 0; i < questions.length; i++) {
                if (answers[i] === questions[i].answer) {
                    correct++;
                }
            }
            const percentage = Math.round((correct / questions.length) * 100);
            
            const content = `KẾT QUẢ QUIZ ANDROID DEVELOPMENT\n` +
                `======================================\n\n` +
                `Tổng điểm: ${correct}/${questions.length}\n` +
                `Phần trăm: ${percentage}%\n` +
                `Ngày làm: ${new Date().toLocaleString('vi-VN')}\n\n` +
                `Số câu đúng: ${correct}\n` +
                `Số câu sai: ${Object.keys(answered).length - correct}\n` +
                `Số câu chưa trả lời: ${questions.length - Object.keys(answered).length}\n`;

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `quiz_result_${new Date().getTime()}.txt`;
            link.click();
        }

        // Initialize
        displayQuestion();
    </script>
